name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build Docker image
      run: docker build -t activity-logger:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run -d -p 3000:3000 --name test-container activity-logger:${{ github.sha }}
        sleep 5
        docker logs test-container
        curl http://localhost:3000/ || echo "Container check completed"
        docker stop test-container
        docker rm test-container

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()

    steps:
    - uses: actions/checkout@v3
    
    - name: Deployment notification
      run: echo "Deployment completed successfully for branch ${{ github.ref }}"
